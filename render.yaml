services:
  - type: web
    name: acolhidas
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:init && npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
